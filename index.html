<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fff8e6">
<meta name="msapplication-navbutton-color" content="#fff8e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Denah Bus KB RA At Tibyan</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --page:#ffffff; --card:#ffffff; --soft:#f6f8ff; --text:#2b2350; --muted:#7a7599; --line:#ece9f7; --line2:#d9d4ee;
  --primary:#6c4df6; --primary-soft:#efeaff; --danger:#e8416b; --ok:#16a36b; --ok-soft:#dcf8ea;
  --sun:#ffc93c; --sun-soft:#fff6d6;
  --anak:#ff6fa5; --anak-bg:#ffe3ee; --anak-tx:#8c1b4b;
  --wali:#ffab1f; --wali-bg:#fff0c2; --wali-tx:#7a4400;
  --guru:#22c1a0; --guru-bg:#d5f7ee; --guru-tx:#09594a;
  --sky:#8fd3ff;
  --bars:#fff8e6;               /* warna status bar & tombol navigasi HP */
  --shadow:0 12px 28px -14px rgba(91,61,245,.35);
  --sw:70px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;background:var(--bars)}
body{overflow-x:hidden;font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--page);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:'Fredoka','Nunito',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.field{width:100%;margin-top:6px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--soft);outline:none}
.field:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#bar{position:fixed;left:0;top:0;height:4px;width:0;background:linear-gradient(90deg,var(--anak),var(--sun),var(--guru));z-index:100;transition:width .4s;border-radius:0 4px 4px 0}
#bar.on{width:80%}

/* ===== header ===== */
.top{position:relative;z-index:20;overflow:visible;width:calc(100% - 24px);max-width:1156px;margin:14px auto 8px;padding:18px 20px;border-radius:30px;
  background:linear-gradient(115deg,#dff3ff 0%,#fff3d1 55%,#ffe2ee 100%);border:3px solid #fff;box-shadow:var(--shadow);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'logo titles btn' 'search search search';gap:14px 22px;align-items:center}
.top>*{position:relative;z-index:1;min-width:0}
.top .deco{position:absolute;z-index:0;pointer-events:none;opacity:.9;font-size:28px;line-height:1}
.deco.d1{top:8px;right:220px;font-size:36px;opacity:.85}
.deco.d2{top:46px;right:300px;font-size:20px}
.deco.d3{top:10px;right:120px;font-size:22px}
.logo{grid-area:logo;width:96px;height:96px;border-radius:50%;background:#fff;border:4px solid #fff;display:grid;place-items:center;font-size:48px;box-shadow:0 10px 22px -8px rgba(91,61,245,.5);overflow:hidden;padding:4px}
.logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:50%}
.titles{grid-area:titles;min-width:0}
.titles h1{min-height:1.1em;font-size:clamp(17px,3.6vw,40px);margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles p{margin:6px 0 0;font-size:14.5px;font-weight:700;color:#5d5688;line-height:1.35}
.titles p.tagline{margin-top:2px;font-weight:600;color:#7a75a0}
#adminBtn{grid-area:btn;padding:12px 22px}
.search{grid-area:search;position:relative;width:100%}
.search input{width:100%;padding:15px 20px 15px 50px;border-radius:99px;border:3px solid #fff;background:#fff;outline:none;transition:.15s;box-shadow:0 6px 16px -10px rgba(91,61,245,.5);font-weight:600}
.search input::placeholder{color:#9a95b8;font-weight:600}
.search input:focus{border-color:var(--primary)}
.search::before{content:'🔍';position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:15px;z-index:2}
#results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:none;z-index:30;overflow:hidden}
#results.show{display:block}
.res{padding:11px 16px;cursor:pointer;display:flex;flex-direction:column;gap:1px;font-size:14px}
.res span{font-size:12px;color:var(--muted);font-weight:600}
.res:hover{background:var(--primary-soft)}
.res.none{cursor:default;color:var(--muted)}
.res.none:hover{background:none}

.btn{border:0;border-radius:99px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer;transition:transform .12s,filter .15s,box-shadow .15s;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 8px 16px -8px rgba(108,77,246,.8)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:#fff;border:2px solid var(--line2);color:var(--text)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.small{padding:9px 14px;font-size:13px}
.btn.tint{background:var(--primary-soft);color:var(--primary)}
.btn:focus-visible,.tab:focus-visible,.pitem:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

main{max-width:1180px;margin:0 auto;padding:8px 16px 48px}

/* ===== toolbar guru ===== */
.admin-bar{background:var(--primary-soft);border:2px dashed #c9bcff;border-radius:22px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.admin-bar .hint{flex:1 1 260px;font-size:13px;color:var(--muted);font-weight:600}
.admin-bar .hint b{color:var(--primary)}
.admin-bar .grp{display:flex;gap:8px;flex-wrap:wrap}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
@media (min-width:700px){.modes{grid-template-columns:repeat(4,1fr)}}
.modes .btn.warn{color:var(--danger)}
.modes .btn.warn:hover{border-color:var(--danger);color:var(--danger)}
.modes .btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== tab bus ===== */
.tabs{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:2px solid var(--line2);background:#fff;border-radius:99px;padding:9px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;transition:.15s}
.tab small{font-family:'Nunito',sans-serif;font-weight:700;font-size:11.5px;color:var(--muted)}
.tab:hover{border-color:var(--primary)}
.tab.active{background:var(--sun);border-color:var(--sun);color:#4a3200;box-shadow:0 8px 16px -8px rgba(255,170,0,.9)}
.tab.active small{color:#7a5400}

/* ===== grid ===== */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px}
.card-head h2{margin:0;font-size:24px;font-weight:700}
.card-head p{margin:3px 0 0;font-size:13.5px;font-weight:600;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:800}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:5px;vertical-align:-2px;border:3px solid}
.legend .l-anak{background:var(--anak-bg);border-color:var(--anak)}
.legend .l-wali{background:var(--wali-bg);border-color:var(--wali)}
.legend .l-guru{background:var(--guru-bg);border-color:var(--guru)}
.legend .l-empty{background:transparent;border:2px dashed var(--line2)}
.legend .l-naik{background:var(--ok);border-color:var(--ok)}

/* ===== bus kuning ===== */
.bus-wrap{overflow-x:auto;padding:14px 14px 6px}
.bus{position:relative;width:max-content;margin:0 auto;background:#fffbe9;border:5px solid var(--sun);border-radius:60px 60px 24px 24px;padding:16px 22px 18px;box-shadow:inset 0 0 0 4px #fff,0 14px 24px -16px rgba(255,170,0,.8)}
.bus::before,.bus::after{content:'';position:absolute;bottom:44px;width:12px;height:56px;background:#4b4570;border-radius:6px}
.bus::before{left:-13px}
.bus::after{right:-13px}
.front{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:6px 8px 14px;margin-bottom:12px;border-bottom:3px dashed #ffe08a}
.driver{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#6a5a2a;background:#fff;padding:7px 14px;border-radius:99px;border:2px solid #ffe08a}
.door{font-size:12.5px;font-weight:800;color:#6a5a2a;border:2px dashed #e8b84a;padding:6px 14px;border-radius:99px;background:#fff}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;width:100%}
.side.bench{width:100%;justify-content:space-between}
.side{--gap:8px;display:flex;gap:var(--gap)}
.aisle{width:34px;text-align:center;font-family:'Fredoka',sans-serif;font-size:13px;font-weight:600;color:#c9a23a}
.back{text-align:center;font-family:'Fredoka',sans-serif;font-size:13px;letter-spacing:.08em;color:#b9923a;font-weight:600;margin-top:4px;padding-top:10px;border-top:3px dashed #ffe08a}

.seat{position:relative;width:var(--sw);height:68px;border-radius:20px 20px 16px 16px;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .15s,box-shadow .15s;outline:none}
.seat::before{content:'';position:absolute;top:-8px;left:18%;right:18%;height:10px;border-radius:10px 10px 4px 4px;background:var(--acc,var(--line2))}
.seat:hover{transform:translateY(-3px) rotate(-1.5deg);box-shadow:0 10px 18px -10px rgba(43,35,80,.5)}
.seat:focus-visible{box-shadow:0 0 0 4px var(--primary-soft),0 0 0 7px var(--primary)}
.seat .short{display:none}
.seat .code{font-size:10.5px;font-weight:800;opacity:.75;letter-spacing:.02em;white-space:nowrap}
.seat .name{font-size:11.5px;font-weight:800;line-height:1.15;text-align:center;padding:0 4px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.seat.anak{background:var(--anak-bg);border-color:var(--anak);color:var(--anak-tx);--acc:var(--anak)}
.seat.wali{background:var(--wali-bg);border-color:var(--wali);color:var(--wali-tx);--acc:var(--wali)}
.seat.guru{background:var(--guru-bg);border-color:var(--guru);color:var(--guru-tx);--acc:var(--guru)}
.seat.empty{background:#fff;border-style:dashed;border-width:2px;border-color:#e6d9a8;color:#b7a875}
.seat.empty .name{font-weight:700;font-size:11px}
.admin .seat.empty:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.seat .tick{display:none;position:absolute;right:-7px;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:13px;font-weight:800;line-height:22px;text-align:center;box-shadow:0 0 0 3px #fff;z-index:3}
.seat.naik .tick{display:block}
.seat.naik{box-shadow:0 0 0 3px var(--ok-soft)}
.seat.sel{outline:4px solid var(--primary);outline-offset:3px;transform:translateY(-3px)}
.seat.hl{z-index:2}
.seat.hl::after{content:'';position:absolute;inset:-5px;border-radius:inherit;border:3px solid var(--primary);pointer-events:none;animation:ring .9s ease-out 3}
.seat.dragging{opacity:.4}
.seat.over{outline:3px solid var(--primary);outline-offset:2px}
.doorseat{height:68px;border-radius:20px 20px 16px 16px;border:3px dashed #e8b84a;background:#fff;color:#8a6a1e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:800}
.doorseat small{font-size:10.5px;font-weight:700;opacity:.8}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.28);opacity:0}}

/* ===== kolom kanan ===== */
.side-col{display:flex;flex-direction:column;gap:18px}
.stat-big{display:flex;align-items:baseline;gap:6px}
.stat-big b{font-family:'Fredoka',sans-serif;font-size:42px;font-weight:700;line-height:1}
.stat-big span{color:var(--muted);font-weight:700}
.progress{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 16px}
.progress div{height:100%;background:linear-gradient(90deg,var(--anak),var(--sun),var(--guru));border-radius:99px;transition:width .5s}
.progress.okbar div{background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{border-radius:18px;padding:10px 4px;text-align:center;background:var(--soft)}
.stats .s-anak{background:var(--anak-bg);color:var(--anak-tx)}
.stats .s-wali{background:var(--wali-bg);color:var(--wali-tx)}
.stats .s-guru{background:var(--guru-bg);color:var(--guru-tx)}
.stats b{display:block;font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600}
.stats span{font-size:11.5px;font-weight:800;opacity:.85}
.naikline{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;margin-top:16px;color:var(--ok)}
.list h3{margin:0 0 10px;font-size:17px;font-weight:600;display:flex;justify-content:space-between}
.plist{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:7px;padding-right:2px}
.pitem{-webkit-tap-highlight-color:transparent;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:18px;background:var(--soft);cursor:pointer;transition:.12s}
.pitem:hover{background:var(--primary-soft)}
.pitem .who{flex:1;min-width:0}
.pitem .ck{color:var(--ok);font-weight:800;font-size:16px}
.badge{min-width:42px;text-align:center;font-size:12.5px;font-weight:800;padding:6px 6px;border-radius:99px;border:2px solid}
.badge.anak{background:var(--anak-bg);border-color:var(--anak);color:var(--anak-tx)}
.badge.wali{background:var(--wali-bg);border-color:var(--wali);color:var(--wali-tx)}
.badge.guru{background:var(--guru-bg);border-color:var(--guru);color:var(--guru-tx)}
.pitem .who{display:flex;flex-direction:column;min-width:0}
.pitem .who b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .who small{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-state{text-align:center;padding:48px 16px;color:var(--muted);font-weight:600}
.empty-state .big{font-size:64px}
.empty-state h2{color:var(--text);margin:8px 0 4px}

/* ===== dialog ===== */
#modal{position:fixed;inset:0;background:rgba(43,35,80,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
#modal.open{display:flex}
.ac{position:relative}
.ac::after{content:'▾';position:absolute;right:14px;top:calc(50% + 3px);transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:14px}
.ac input{padding-right:34px!important}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:2px solid var(--line2);border-radius:14px;box-shadow:0 14px 28px -12px rgba(43,35,80,.35);max-height:190px;overflow:auto;z-index:10}
.ac-item{padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;border-bottom:1px solid var(--line)}
.ac-item:last-child{border-bottom:0}
.ac-item:hover,.ac-item:active{background:var(--primary-soft)}
.ac-none{padding:10px 14px;font-size:13px;font-weight:700;color:var(--muted);background:#fff}
.sheet{background:#fff;border-radius:28px;padding:24px;width:min(450px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:20px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet p{margin:0 0 12px;font-size:14px;font-weight:600}
.pill{font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;background:var(--sun-soft);color:#7a5400;padding:4px 12px;border-radius:99px}
.sheet label{display:block;font-size:13px;font-weight:800;margin:12px 0 0}
.sheet [hidden]{display:none!important}
.sheet input[type=text],.sheet input[type=tel],.sheet input[type=password],.sheet input[type=number],.sheet select,.sheet textarea,.sheet input:not([type]){width:100%;margin-top:6px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--soft);outline:none;font-weight:600}
.sheet textarea{min-height:160px;resize:vertical;font-size:13.5px}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.seg label{margin:0}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:10px 4px;border-radius:16px;border:2px solid var(--line);cursor:pointer;font-weight:800;font-size:13px}
.seg input:checked + span{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.chk{display:flex!important;align-items:center;gap:10px;font-weight:700!important;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--primary)}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.err{color:var(--danger);font-size:13px;font-weight:800;margin-top:10px}
.info-card{display:flex;gap:14px;align-items:center;margin:8px 0 4px}
.info-card .seat-big{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-family:'Fredoka',sans-serif;font-size:24px;font-weight:600;border:4px solid;flex:0 0 auto}
.info-card .seat-big.anak{background:var(--anak-bg);border-color:var(--anak);color:var(--anak-tx)}
.info-card .seat-big.wali{background:var(--wali-bg);border-color:var(--wali);color:var(--wali-tx)}
.info-card .seat-big.guru{background:var(--guru-bg);border-color:var(--guru);color:var(--guru-tx)}
.info-card h4{margin:0;font-size:20px;font-weight:600}
.info-card small{color:var(--muted);font-size:13px;font-weight:700}
.note{background:var(--sun-soft);border-radius:14px;padding:9px 12px;font-size:13px;font-weight:700;color:#7a5400;margin:10px 0 0}
.contact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.logrow{display:flex;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.logrow time{color:var(--muted);font-weight:700;white-space:nowrap}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#2b2350;color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--danger)}

.skeleton{height:420px;border-radius:28px;background:linear-gradient(90deg,#f1eefc 25%,#fff 50%,#f1eefc 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

#qpill{position:fixed;left:12px;bottom:72px;z-index:80;background:#fff;border:2px solid var(--sun);color:#7a5400;border-radius:99px;padding:9px 14px;font-weight:800;font-size:12.5px;box-shadow:var(--shadow);cursor:pointer;max-width:calc(100vw - 24px)}
#qpill[hidden]{display:none}
#bye{position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#bye img{width:140px;height:140px;object-fit:contain}
#bye h2{margin:0;font-size:22px}
#bye p{margin:0;color:var(--muted);font-weight:700;font-size:14px;max-width:320px}

<body>
<div id="bar"></div>

<header class="top no-print">
  <span class="deco d1">☁️</span><span class="deco d2">⭐</span><span class="deco d3">🎈</span>
  <div class="logo"><img src="logo.png" alt="Logo KB RA At Tibyan" width="96" height="96" onerror="this.replaceWith(document.createTextNode('🐥'))"></div>
  <div class="titles">
    <h1 id="title"></h1>
    <p id="school">KB RA At Tibyan</p>
    <p id="tagline" class="tagline">cari nama si kecil, temukan kursinya</p>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Cari nama anak atau wali…" autocomplete="off">
    <div id="results"></div>
  </div>
  <button id="adminBtn" class="btn ghost">🔒 Masuk Guru</button>
</header>

<main id="app"><div class="skeleton"></div></main>
<footer class="foot no-print">
  <button id="exitBtn" class="btn ghost small" type="button">🚪 Keluar Aplikasi</button>
  <div style="margin-top:12px"><span id="ver"></span></div>
</footer>
<div id="modal"></div>
<div id="qpill" class="no-print" hidden role="button" tabindex="0"></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* ======= PENGATURAN ======= */
  var SCHOOL_NAME = 'KB RA At Tibyan';
  var EVENT_NAME  = 'Outbound 2026';        // ganti sesuai acara
  var REFRESH_MS  = 20000;                  // pembaruan otomatis (20 dtk)
  var KELAS = ['KB', 'TK A', 'TK B'];       // pilihan kelas untuk anak
  var TUGAS = ['Kepala Sekolah', 'Wali Kelas KB', 'Wali Kelas TK A', 'Wali Kelas TK B'];  // pilihan tugas untuk guru
  /* ========================== */

  var NEED_VER = 9;                         // versi Code.gs yang dibutuhkan halaman ini
  var LETTERS = 'ABCDEF';
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  /* ======= PENGHUBUNG KE GOOGLE APPS SCRIPT ======= */
  // Tempel URL Web App Anda di sini (berakhiran /exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycbxPLnG1r09MiEZ-aOqbJfE7Jyc5ngbppbOX-zqvQ6tajP6JszmYr2gBUDh8NRLyBDXbvw/exec';
  var URL_RE = /^https:\/\/script\.google\.com\/.+\/exec$/;
  function apiReady() { return URL_RE.test(API_URL); }
  if (!apiReady()) {
    try {
      var fromQuery = new URLSearchParams(location.search).get('api');
      var saved = fromQuery || localStorage.getItem('denah_api') || '';
      if (URL_RE.test(saved)) { API_URL = saved; localStorage.setItem('denah_api', saved); }
    } catch (e) { /* abaikan */ }
  }

  function unwrap(j) {
    if (!j || j.ok !== true) throw new Error((j && j.error) ? j.error : 'Respon server tidak valid.');
    return j.data;
  }
  function netError() {
    return new Error('Tidak bisa terhubung ke server. Periksa sinyal internet Anda.');
  }
  function rpc(action, args) {
    if (!apiReady()) {
      return Promise.reject(new Error('API_URL di index.html belum diisi dengan URL Web App (berakhiran /exec).'));
    }
    var ctl = window.AbortController ? new AbortController() : null;
    var tm = ctl ? setTimeout(function () { ctl.abort(); }, 25000) : 0;   // sinyal lemah: jangan menunggu selamanya
    var sg = ctl ? { signal: ctl.signal } : {};
    var req = action === 'getData'
      ? fetch(API_URL + '?action=getData&_=' + Date.now(), sg)
      : fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, args: args }),
          signal: sg.signal
        });
    return req
      .catch(function () { throw netError(); })
      .then(function (r) { return r.json().catch(function () { throw netError(); }); })
      .then(function (v) { clearTimeout(tm); return v; }, function (e) { clearTimeout(tm); throw e; })
      .then(unwrap);
  }
  var api = { getData: function () { return rpc('getData', []); } };
  ['login', 'logout', 'getFull', 'getLog', 'saveJudul', 'savePenumpang', 'movePenumpang', 'removePenumpang',
   'setNaik', 'clearNaik', 'importPenumpang', 'saveBus', 'deleteBus', 'changePin']
    .forEach(function (n) {
      api[n] = function () { return rpc(n, Array.prototype.slice.call(arguments)); };
    });

  var S = { ver: 0, judul: '', buses: [], pnp: [], busId: null, admin: false, tok: '', mode: 'edit', moveFrom: null,
            hl: null, sig: '', loaded: false, pending: 0, deep: null, suara: true };
  var drag = null, hlTimer = null, confirmRes = null;

  /* ---------- util data ---------- */
  function applyTitle() {
    var t = S.judul || ('Denah Bus ' + EVENT_NAME);
    $('#title').textContent = t;
    document.title = t + ' · ' + SCHOOL_NAME;
  }
  function cacheJudul() { try { localStorage.setItem('denah_judul', S.judul); } catch (x) { /* abaikan */ } }
  /* simpan denah (data publik saja) di perangkat ini agar langsung tampil saat dibuka lagi / tanpa sinyal */
  function cacheData(d) {
    /* HP & catatan tidak pernah disimpan di perangkat: hanya data publik */
    var pub = {
      buses: d.buses, ver: d.ver, judul: d.judul,
      penumpang: d.penumpang.map(function (p) {
        return { busId: p.busId, kursi: p.kursi, nama: p.nama, tipe: p.tipe, info: p.info, naik: p.naik };
      })
    };
    try { localStorage.setItem('denah_data', JSON.stringify(pub)); } catch (x) { /* abaikan */ }
  }
  function curBus() { return S.buses.find(function (b) { return b.id === S.busId; }); }
  function isDoorRow(b, r) { return Number(b.pintuBaris) === r && r <= b.baris; }
  function parseRows(v) {
    var seen = {}, out = [];
    String(v == null ? '' : v).split(/[^0-9]+/).forEach(function (x) {
      var n = parseInt(x, 10);
      if (n >= 1 && !seen[n]) { seen[n] = 1; out.push(n); }
    });
    return out.sort(function (a, b) { return a - b; });
  }
  function leftCount(b, r) {
    var j = Number(b.kiriJumlah);
    if (j >= 1 && j < b.kiri && parseRows(b.kiriBaris).indexOf(r) > -1) return j;
    if (isDoorRow(b, r)) return 0;
    return b.kiri;
  }
  function backN(b) {
    var n = Number(b.belakang);
    return ((n === 5 || n === 6) && n !== b.kiri + b.kanan) ? n : 0;
  }
  function seatsOf(b) {
    var out = [], bn = backN(b);
    for (var r = 1; r <= b.baris; r++) {
      var bench = bn && r === b.baris, n = bench ? bn : b.kiri + b.kanan;
      var lc = bench ? 0 : leftCount(b, r);
      for (var c = 0; c < n; c++) {
        if (!bench && c >= lc && c < b.kiri) continue;
        out.push(r + LETTERS[c]);
      }
    }
    return out;
  }
  function paxMap(busId) {
    var m = {};
    S.pnp.forEach(function (p) { if (p.busId === busId) m[p.kursi] = p; });
    return m;
  }
  function tipeCls(t) { return t === 'Wali' ? 'wali' : (t === 'Guru' ? 'guru' : 'anak'); }
  function emojiOf(t) { return t === 'Wali' ? '👪' : (t === 'Guru' ? '🧑‍🏫' : '🧒'); }
  function infoLabel(t) {
    return t === 'Wali' ? 'Wali dari (nama anak)' : (t === 'Guru' ? 'Tugas' : 'Kelas');
  }
  function pilihOpts(base, v, placeholder) {
    var list = base.slice();
    if (v && list.indexOf(v) < 0) list.push(v);
    return '<option value="">' + placeholder + '</option>' + list.map(function (k) {
      return '<option value="' + esc(k) + '"' + (k === v ? ' selected' : '') + '>' + esc(k) + '</option>';
    }).join('');
  }
  function kelasOpts(v) { return pilihOpts(KELAS, v, '— Pilih kelas —'); }
  function tugasOpts(v) { return pilihOpts(TUGAS, v, '— Pilih tugas —'); }
  function descOf(p) {
    var i = p.info ? esc(p.info) : '';
    if (p.tipe === 'Wali') return 'Wali' + (i ? ' dari ' + i : ' murid');
    if (p.tipe === 'Guru') return 'Guru' + (i ? ' · ' + i : '');
    return 'Anak' + (i ? ' · ' + i : '');
  }
  function shortName(n) {
    var w = String(n).trim().split(/\s+/);
    return w.length > 1 ? w[0] + ' ' + w[1].charAt(0).toUpperCase() + '.' : w[0];
  }
  function seatKey(code) { return parseInt(code, 10) * 10 + LETTERS.indexOf(code.slice(-1)); }
  function countFor(busId) { return S.pnp.filter(function (p) { return p.busId === busId; }).length; }
  function waLink(hp) {
    var d = String(hp || '').replace(/[^0-9]/g, '');
    if (d.charAt(0) === '0') d = '62' + d.slice(1);
    return 'https://wa.me/' + d;
  }

  /* ---------- UI helpers ---------- */
  function busy(on) { $('#bar').classList.toggle('on', !!on); }
  var toastT;
  function toast(msg, type) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = (type === 'err' ? 'err ' : '') + 'show';
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.className = ''; }, 3200);
  }
  function modal(html) {
    var m = $('#modal');
    m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
    m.classList.add('open');
    fitModal();
    var f = m.querySelector('input:not([type=radio]):not([type=checkbox]),select,textarea,button');
    if (f) setTimeout(function () { f.focus(); fitModal(); }, 60);
  }
  /* dialog selalu berada di area yang terlihat (di atas keyboard HP), terletak di tengah antara batas atas dan keyboard */
  function fitModal() {
    var m = $('#modal'), vv = window.visualViewport;
    if (!vv) return;
    m.style.top = vv.offsetTop + 'px';
    m.style.bottom = 'auto';
    m.style.height = vv.height + 'px';
    var a = document.activeElement;
    if (m.classList.contains('open') && a && m.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) {
      setTimeout(function () { try { a.scrollIntoView({ block: 'nearest' }); } catch (x) { /* abaikan */ } }, 50);
    }
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitModal);
    window.visualViewport.addEventListener('scroll', fitModal);
  }

  /* daftar nama anak (untuk kolom "Wali dari"): kotak ketik + daftar turun berlatar putih */
  var acNames = [];
  function acRender(q) {
    var box = $('#acList');
    if (!box) return;
    q = String(q || '').trim().toLowerCase();
    var hits = acNames.filter(function (n) { return !q || n.toLowerCase().indexOf(q) > -1; });
    box.innerHTML = hits.length
      ? hits.map(function (n) { return '<div class="ac-item" data-v="' + esc(n) + '">' + esc(n) + '</div>'; }).join('')
      : '<div class="ac-none">Nama anak tidak ditemukan</div>';
    box.hidden = false;
  }
  function acHide() { var box = $('#acList'); if (box) box.hidden = true; }
  function closeModal() {
    if (confirmRes) { var r = confirmRes; confirmRes = null; r(false); }
    var m = $('#modal');
    m.classList.remove('open');
    m.innerHTML = '';
  }
  function confirmBox(msg, label) {
    return new Promise(function (res) {
      confirmRes = res;
      modal('<h3>Yakin?</h3><p>' + msg + '</p><div class="actions">' +
        '<button class="btn ghost" data-r="0">Batal</button>' +
        '<button class="btn danger" data-r="1">' + esc(label || 'Ya, lanjutkan') + '</button></div>');
    });
  }
  function updateHeader() {
    var b = $('#adminBtn');
    b.textContent = S.admin ? '🔓 Keluar Mode Guru' : '🔒 Masuk Guru';
    b.className = 'btn ' + (S.admin ? 'tint' : 'ghost');
    updateQ();
  }
  function logout(silent) {
    if (S.tok) { api.logout(S.tok).catch(function () { /* abaikan */ }); }
    S.admin = false; S.tok = ''; S.mode = 'edit'; S.moveFrom = null; S.sig = '';
    tokClear();
    updateHeader(); render();
    if (!silent) toast('Anda sudah keluar dari mode guru');
    load({ silent: true, force: true });   // ganti ke data publik (tanpa HP & catatan)
  }
  var AUTH_RE = /^PIN salah|^Terlalu banyak|^Sesi/;
  function authFail(e) {
    if (AUTH_RE.test(e.message)) { closeModal(); logout(true); return true; }
    return false;
  }

  /* ---------- memuat data ---------- */
  function showSetup() {
    $('#app').innerHTML = '<div class="card" style="max-width:560px;margin:24px auto">' +
      '<h2 style="margin:0 0 6px;font-size:22px">⚙️ Langkah terakhir: hubungkan ke Google Sheet</h2>' +
      '<p class="muted" style="font-size:14px;margin:0 0 10px">Halaman ini sudah benar. Alamat Web App Google Apps Script belum diisi.</p>' +
      '<ol style="font-size:14px;line-height:1.7;padding-left:20px;margin:0 0 12px">' +
      '<li>Di Apps Script: Deploy → Deployment baru → Aplikasi web, akses: <b>Anyone</b>.</li>' +
      '<li>Salin URL yang berakhiran <b>/exec</b>.</li>' +
      '<li>Tempel di bawah untuk mencoba. Agar berlaku untuk semua orang, isi juga <b>API_URL</b> di file index.html.</li></ol>' +
      '<input id="apiInput" class="field" type="text" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">' +
      '<div class="err" id="apiErr"></div>' +
      '<div class="actions"><button class="btn primary" data-act="saveApi">Simpan &amp; coba</button></div></div>';
  }

  function applyData(d) {
    S.ver = Number(d.ver) || 0; S.judul = String(d.judul || ''); applyTitle(); cacheJudul();
    S.buses = d.buses; S.pnp = d.penumpang; S.loaded = true;
    applyQueue();                         // tampilkan absen yang belum terkirim di atas data server
    if (!curBus()) S.busId = S.buses.length ? S.buses[0].id : null;
  }

  function load(opts) {
    opts = opts || {};
    if (!apiReady()) { if (!opts.silent) { applyTitle(); showSetup(); } return Promise.resolve(); }
    var req = S.admin ? api.getFull(S.tok) : api.getData();
    return req.then(function (d) {
      var sig = JSON.stringify([d.buses, d.penumpang, d.ver, d.judul]);
      if (opts.silent && !opts.force && sig === S.sig) return;
      if (S.pending && opts.silent && !opts.force) return;     // jangan menimpa perubahan yang sedang dikirim
      S.sig = sig;
      S.partial = false;
      applyData(d); cacheData(d);
      render();
      if (S.deep) { var q = S.deep; S.deep = null; deepLink(q); }
    }).catch(function (e) {
      if (S.admin && /^Sesi/.test(e.message)) { logout(true); toast('Sesi guru berakhir, silakan masuk lagi', 'err'); return; }
      if (opts.silent) return;
      if (!$('#title').textContent) applyTitle();
      if (S.loaded) toast(e.message, 'err');
      else $('#app').innerHTML = '<div class="empty-state"><div class="big">😿</div><h2>Denah belum bisa dibuka</h2><p>' +
        esc(e.message) + '</p><button class="btn primary" data-act="retry">Coba lagi</button></div>';
    });
  }

  /* aksi guru biasa: tunggu server lalu muat ulang (untuk aksi yang jarang) */
  function run(fn, okMsg) {
    busy(true); S.pending++;
    return fn().then(function () {
      closeModal();
      if (okMsg) toast(okMsg);
      S.pending--;
      return load({ force: true, silent: true });
    }).catch(function (e) {
      S.pending = Math.max(0, S.pending - 1);
      toast(e.message, 'err');
      var fe = $('#formErr'); if (fe) fe.textContent = e.message;
      authFail(e);
    }).then(function () { busy(false); });
  }

    }).catch(function (e) {
      S.pending = Math.max(0, S.pending - 1);

  /* gulir halus bawaan browser (dijalankan compositor, tidak ikut tersendat); sorotan dimulai setelah gulir berhenti */
  function afterScroll(cb) {
    var last = -1, still = 0, tries = 0;
    (function tick() {
      var y = Math.round(window.pageYOffset);
      still = (y === last) ? still + 1 : 0; last = y;
      if (still >= 4 || ++tries > 90) cb(); else requestAnimationFrame(tick);
    })();
  }
  var focusJob = 0;
  function focusSeat(busId, code) {

    document.querySelectorAll('.seat.hl').forEach(function (x) { x.classList.remove('hl'); });
    var el = document.querySelector('.seat[data-seat="' + code + '"]');
    clearTimeout(hlTimer);
    if (el) {
      var r = el.getBoundingClientRect();
      var top = Math.max(0, window.pageYOffset + r.top - (window.innerHeight / 2 - r.height / 2));
      window.scrollTo({ top: top, behavior: 'smooth' });
      afterScroll(function () {
        if (job !== focusJob) return;
        el.classList.add('hl');
        hlTimer = setTimeout(function () {

  function mmPx(mm) { return mm * 96 / 25.4; }

  function waitImgs(root) {
    var jobs = Array.prototype.map.call(root.querySelectorAll('img'), function (im) {
      return im.complete ? null : new Promise(function (ok) {
        im.addEventListener('load', ok); im.addEventListener('error', ok);
      });
    }).filter(Boolean);
    return Promise.all(jobs);
  }

  function exportPrint(k) {
    var P = PAPERS[k], MG = 10;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:-20000px;top:0';
    probe.innerHTML = exportHtml();
    document.body.appendChild(probe);
    var H = probe.firstChild.offsetHeight;
    document.body.removeChild(probe);
    var aw = mmPx(P.w - 2 * MG), ah = mmPx(P.h - 2 * MG - 2);
    var f = Math.min(1, aw / EX_W, ah / H);
    var root = $('#printRoot');
    if (!root) { root = document.createElement('div'); root.id = 'printRoot'; document.body.appendChild(root); }
    var st = $('#pageStyle');
    if (!st) { st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
    st.textContent = '@page{size:' + P.w + 'mm ' + P.h + 'mm;margin:0}';
    root.innerHTML = '<div class="ex-page" style="width:' + P.w + 'mm;height:' + (P.h - 1) + 'mm;padding:' + MG + 'mm">' +
      '<div style="width:' + EX_W + 'px;transform:scale(' + f + ');transform-origin:top left;margin-left:' + ((aw - EX_W * f) / 2) + 'px">' +
      exportHtml() + '</div></div>';
    waitImgs(root).then(function () {
      document.body.classList.add('printing');
      setTimeout(function () { window.print(); }, 150);
    });
  }
  window.addEventListener('afterprint', function () {
    document.body.classList.remove('printing');
    var r = $('#printRoot'); if (r) r.innerHTML = '';
  });

  function loadScript(url) {
    return new Promise(function (ok, fail) {
      var s = document.createElement('script');
      s.src = url; s.onload = ok; s.onerror = function () { fail(new Error('lib')); };
      document.head.appendChild(s);
    });
  }
  function loadPdfLibs() {
    var p = Promise.resolve();
    if (!window.html2canvas) p = p.then(function () { return loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'); });
    if (!(window.jspdf && window.jspdf.jsPDF)) p = p.then(function () { return loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); });
    return p;
  }
  function exportPdf(k) {
    var P = PAPERS[k], MG = 10, b = curBus(), host = null;
    busy(true); toast('Membuat PDF…');
    loadPdfLibs().then(function () {
      host = document.createElement('div');
      host.id = 'exCap';
      host.style.cssText = 'position:fixed;left:-20000px;top:0;width:' + EX_W + 'px;background:#fff';
      host.innerHTML = exportHtml();
      document.body.appendChild(host);
      return waitImgs(host);
    }).then(function () {
      return window.html2canvas(host, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true, windowWidth: 1200, scrollX: 0, scrollY: 0,
        onclone: function (doc) {
          var e = doc.getElementById('exCap');
          if (e) { e.style.left = '0'; e.style.position = 'absolute'; }
        }
      });
    }).then(function (canvas) {
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [P.w, P.h] });
      var aw = P.w - 2 * MG, ah = P.h - 2 * MG, ratio = canvas.width / canvas.height;
      var w = aw, h = w / ratio;
      if (h > ah) { h = ah; w = h * ratio; }
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', (P.w - w) / 2, MG, w, h);
      var nama = String(b.nama).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'Bus';
      pdf.save('Denah-Bus-' + nama + '-' + k + '.pdf');
      toast('PDF tersimpan ✓');
    }).catch(function () {
      toast('PDF gagal dibuat. Coba tombol Cetak lalu pilih "Simpan sebagai PDF".', 'err');
    }).then(function () {
      if (host && host.parentNode) host.parentNode.removeChild(host);
      busy(false);
    });
  }

  });
  app.addEventListener('dragover', function (e) {
    if (!drag) return;
    var s = e.target.closest('.seat');
    if (s) { e.preventDefault(); s.classList.add('over'); }
  });
  app.addEventListener('dragleave', function (e) {
    var s = e.target.closest('.seat');
    if (s) s.classList.remove('over');
  });
  app.addEventListener('drop', function (e) {
    var s = e.target.closest('.seat');
    if (!s || !drag) return;
    e.preventDefault();
    var from = drag, to = s.dataset.seat;
    drag = null;
    if (from === to) { render(); return; }
    moveSeat(from, to);
  });
  app.addEventListener('dragend', function () {
    drag = null;
    document.querySelectorAll('.dragging,.over').forEach(function (x) { x.classList.remove('dragging', 'over'); });
  });

  $('#adminBtn').addEventListener('click', function () {
    if (S.admin) logout(); else openLogin();
  });

  /* ---------- sesi guru (tersimpan di HP selama masa berlaku 6 jam) ---------- */
  function tokSave(t) { try { localStorage.setItem('denah_tok', JSON.stringify({ t: t, at: Date.now() })); } catch (x) { /* abaikan */ } }
  function tokLoad() {
    try {
      var o = JSON.parse(localStorage.getItem('denah_tok') || 'null');
      if (o && o.t && Date.now() - o.at < 21600000 - 60000) return o.t;
      localStorage.removeItem('denah_tok');
    } catch (x) { /* abaikan */ }
    return '';
  }
  function tokClear() {
    try { localStorage.removeItem('denah_tok'); } catch (x) { /* abaikan */ }
    try { sessionStorage.removeItem('denah_tok'); } catch (x) { /* abaikan */ }
  }

  /* ---------- antrean absen (jalan tanpa sinyal, dikirim otomatis saat sinyal kembali) ---------- */
  var Q = [], flushing = false;
  try { Q = JSON.parse(localStorage.getItem('denah_queue') || '[]') || []; } catch (x) { Q = []; }
  function qSave() { try { localStorage.setItem('denah_queue', JSON.stringify(Q)); } catch (x) { /* abaikan */ } }
  function qAdd(it) {
    if (it.k === 'naik') {
      Q = Q.filter(function (x) { return !(x.k === 'naik' && x.busId === it.busId && x.kursi === it.kursi); });
    }
    Q.push(it); qSave(); updateQ(); flushQueue();
  }
  function applyQueue() {
    if (!Q.length) return;
    Q.forEach(function (it) {
      S.pnp.forEach(function (p) {
        if (p.busId !== it.busId) return;
        if (it.k === 'clear') p.naik = false;
        else if (p.kursi === it.kursi) p.naik = !!it.val;
      });
    });
  }
  function updateQ() {
    var el = $('#qpill');
    if (!el) return;
    if (!Q.length || !S.admin) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = (navigator.onLine === false ? '📴 Offline · ' : '⏳ ') + Q.length + ' absen menunggu dikirim';
  }
  function flushQueue() {
    if (flushing || !Q.length || !S.admin || !S.tok || navigator.onLine === false) return Promise.resolve();
    flushing = true; busy(true);
    var failed = 0, stop = false;
    function step() {
      if (!Q.length || stop) return Promise.resolve();
      var it = Q[0];
      var call = it.k === 'clear' ? api.clearNaik(S.tok, it.busId) : api.setNaik(S.tok, it.busId, it.kursi, it.val);
      return call.then(function () {
        Q.shift(); qSave(); updateQ(); return step();
      }, function (e) {
        if (/^Tidak bisa terhubung/.test(e.message)) { stop = true; return; }          // belum ada sinyal: coba lagi nanti
        if (AUTH_RE.test(e.message)) {                                                // sesi habis: antrean tetap disimpan
          stop = true; authFail(e);
          toast('Sesi guru berakhir. Masuk lagi untuk mengirim ' + Q.length + ' absen tertunda.', 'err');
          return;
        }
        Q.shift(); qSave(); updateQ(); failed++; return step();                       // ditolak server (mis. kursi sudah kosong): buang
      });
    }
    return step().then(function () {
      flushing = false; busy(false); updateQ();
      if (failed) toast(failed + ' perubahan absen ditolak server', 'err');
      if (!Q.length && S.admin) return load({ force: true, silent: true });
    });
  }

  /* ---------- salam pembuka (salam.mp3) ---------- */
  function salamDone() { try { sessionStorage.setItem('denah_salam', '1'); } catch (x) { /* abaikan */ } }
  function salam() {
    if (!S.suara) return;
    try { if (sessionStorage.getItem('denah_salam')) return; } catch (x) { /* abaikan */ }
    var a;
    try { a = new Audio('salam.mp3'); a.preload = 'auto'; } catch (x) { return; }
    S.salamAudio = a;
    var p = a.play();
    if (p && p.then) {
      p.then(salamDone).catch(function () {
        /* browser memblokir suara otomatis: putar pada sentuhan pertama */
        var h = function () {
          document.removeEventListener('pointerdown', h, true);
          document.removeEventListener('keydown', h, true);
          a.play().then(salamDone).catch(function () { /* abaikan */ });
        };
        document.addEventListener('pointerdown', h, true);
        document.addEventListener('keydown', h, true);
      });
    } else { salamDone(); }
  }

  /* ---------- keluar aplikasi ---------- */
  function showBye() {
    if ($('#bye')) return;
    var d = document.createElement('div');
    d.id = 'bye';
    d.innerHTML = '<img src="logo.png" alt="" onerror="this.style.display=\'none\'"><h2>Anda sudah keluar</h2>' +
      '<p>Silakan tekan tombol Beranda atau geser aplikasi ini untuk menutupnya.</p>' +
      '<button class="btn primary" type="button" id="byeOpen">Buka lagi</button>';
    document.body.appendChild(d);
    $('#byeOpen').addEventListener('click', function () { location.reload(); });
  }
  function exitApp() {
    confirmBox('Keluar dari aplikasi?', 'Keluar').then(function (ok) {
      if (!ok) return;
      S.pending = 1e9;                                   // hentikan pembaruan otomatis
      try { if (S.salamAudio) S.salamAudio.pause(); } catch (x) { /* abaikan */ }
      try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (x) { /* abaikan */ }
      if (S.tok) { api.logout(S.tok).catch(function () { /* abaikan */ }); }
      S.admin = false; S.tok = '';
      tokClear();
      try { sessionStorage.removeItem('denah_salam'); } catch (x) { /* abaikan */ }
      try { window.close(); } catch (x) { /* abaikan */ }
      setTimeout(showBye, 350);                          // jika browser tidak mengizinkan menutup sendiri
    });
  }
  $('#exitBtn').addEventListener('click', exitApp);

  /* ---------- mulai ---------- */
  try {                                   // judul tersimpan dari kunjungan sebelumnya
    var cj = localStorage.getItem('denah_judul');
    if (cj !== null) { S.judul = cj; applyTitle(); }
  } catch (x) { /* abaikan */ }
  try { S.suara = localStorage.getItem('denah_suara') !== '0'; } catch (x) { /* abaikan */ }
  var tk = tokLoad();                     // sesi guru berlaku sampai habis masa 6 jam (juga saat aplikasi dibuka tanpa sinyal)
  if (tk) { S.admin = true; S.tok = tk; S.partial = true; }
  try {                                   // tampilkan denah tersimpan dulu (instan), lalu perbarui dari server
    var cd = JSON.parse(localStorage.getItem('denah_data') || 'null');
    if (cd && cd.buses && cd.penumpang) { applyData(cd); render(); }
  } catch (x) { /* abaikan */ }
  try { S.deep = new URLSearchParams(location.search).get('cari'); } catch (x) { /* abaikan */ }
  $('#school').textContent = SCHOOL_NAME;
  $('#ver').textContent = 'Created by : KB RA At Tibyan';
  updateHeader();
  salam();
  load({ force: true });
  flushQueue();
  setInterval(flushQueue, 20000);
  window.addEventListener('online', function () { updateQ(); flushQueue(); });
  window.addEventListener('offline', updateQ);
  $('#qpill').addEventListener('click', function () {
    if (navigator.onLine === false) toast('Belum ada sinyal. Data tersimpan di HP.', 'err'); else flushQueue();
  });
  setInterval(function () {
    if (document.hidden || modalEl.classList.contains('open') || drag || S.pending) return;
    load({ silent: true });
  }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !S.pending && !modalEl.classList.contains('open')) load({ silent: true });
  });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* abaikan */ }); });
  }
})();
</script>
</body>
</html>
